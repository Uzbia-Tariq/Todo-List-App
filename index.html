<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Task Organizer</title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

 <link rel="stylesheet" href="style.css">

</head>

<body
    class="flex justify-center items-center min-h-screen p-6">

    <!-- Main Container -->

    <div
        class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl p-8">

        <!-- Heading -->

        <h1
            class="text-4xl font-bold text-center text-slate-800 mb-8">

           Task Organizer

        </h1>

        <!-- Input Section -->

        <div class="flex gap-3 mb-6">

            <input
                id="taskInput"
                type="text"
                placeholder="What do you want to accomplish today?"
                class="flex-1 border-2 border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500">

            <button
                id="addButton"
                class="bg-blue-600 hover:bg-blue-700 transition text-white px-6 rounded-xl">

                <i class="fa-solid fa-plus"></i>

                Add

            </button>

        </div>

        <!-- Task Container -->

        <div
            id="taskContainer"
            class="space-y-4">

        </div>

        <!-- Empty State -->

        <div
            id="emptyState"
            class="text-center py-14 text-slate-400">

            <i
                class="fa-regular fa-clipboard text-7xl mb-4">
            </i>

            <h2
                class="text-2xl font-semibold">

               No Tasks Yet

            </h2>

            <p class="mt-2">

                Every big goal starts with one task.

            </p>

        </div>

        <!-- Footer -->

        <div
            class="flex justify-between items-center mt-8 border-t pt-5">

            <p
                class="font-semibold">

                Total Tasks :

                <span
                    id="taskCounter">

                    0

                </span>

            </p>

            <button
                id="deleteAllButton"
                class="bg-red-600 hover:bg-red-700 transition text-white px-5 py-3 rounded-xl">

                <i class="fa-solid fa-trash"></i>

                Delete All

            </button>

        </div>

    </div>
<script src="javascript.js"></script>

</body>
</html>
